version: '3.8'

services:
  la-roca:
    # Pull the official high-performance image from BlockMaker Hub.
    image: blockmaker/la-roca-kv:latest
    container_name: la-roca-engine
    
    # Allows local builds for developers modifying the Assembly source.
    build: .

    # ⚡ "The Immortal Choice": Force a violent termination (SIGKILL).
    # This demonstrates absolute confidence in our Write-Ahead Logging (WAL)
    # and hardware-accelerated (CRC32) recovery architecture.
    stop_signal: SIGKILL
    stop_grace_period: 0s

    ports:
      - "8080:8080"

    # Engine runtime configuration
    environment:
      - LOG_LEVEL=trace      # Options: trace, error, none
      - ROCK_PORT=8080
      - ROCK_KEY_SIZE=32     # Maximum key geometry
      - ROCK_SLOT_SIZE=1024  # Total fixed-size record (1KB)

    # 💾 Persistence: Commented by default to prevent interference 
    # with the automated test suite's internal lifecycle management.
    # volumes:
    #   - ./db:/app/db

    # Set to 'no' so the test runner (test_recovery.sh) maintains
    # exclusive control over the container resurrection logic.
    restart: no
