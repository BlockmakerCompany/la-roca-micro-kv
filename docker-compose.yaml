version: '3.8'

services:
  api:
    build: .
    container_name: kvs-api
    image: micro-kv-asm:1.0.0

    # ⚡ "The Immortal Choice": Force a violent termination (SIGKILL).
    # This demonstrates absolute confidence in our Write-Ahead Logging (WAL)
    # and hardware-accelerated (CRC32) recovery architecture.
    stop_signal: SIGKILL
    stop_grace_period: 0s

    ports:
      - "8080:8080"

    environment:
      - LOG_LEVEL=trace      # Options: trace, error, none
      - ROCK_PORT=8080
      - ROCK_KEY_SIZE=32     # Initial key geometry
      - ROCK_SLOT_SIZE=1024  # Total record size (1KB)

    # volumes:
    #   # Uncomment for real persistence outside the test suite:
    #   - ./db:/app/db

    # Keep as 'no' so test scripts (test_recovery.sh) maintain
    # full control over the container lifecycle.
    restart: no