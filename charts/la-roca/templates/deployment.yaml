apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "la-roca.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "la-roca.name" . }}
    instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "la-roca.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "la-roca.name" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Native Assembly execution is nearly instantaneous.
          # We use a simple TCP socket check for liveness.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: storage
              mountPath: /app/db
      volumes:
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "la-roca.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}