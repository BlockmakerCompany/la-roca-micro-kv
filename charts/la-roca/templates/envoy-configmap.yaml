apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "la-roca.fullname" . }}-envoy-config
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: la_roca_service
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route:
                                cluster: la_roca_cluster
                                # This ensures the key is used for consistent hashing
                                hash_policy:
                                  - header: { header_name: "x-key" }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: la_roca_cluster
          connect_timeout: 0.25s
          type: STRICT_DNS
          lb_policy: RING_HASH
          load_assignment:
            cluster_name: la_roca_cluster
            endpoints:
              - lb_endpoints:
                  # Pointing to the Headless Service of La Roca
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ include "la-roca.fullname" . }}-headless
                          port_value: 8080
          common_lb_config:
            ring_hash_lb_config:
              minimum_ring_size: 1024